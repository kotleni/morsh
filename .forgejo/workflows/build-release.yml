on:
  push:
    tags:
      - v*
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          files: |-
            target/release/dshell
